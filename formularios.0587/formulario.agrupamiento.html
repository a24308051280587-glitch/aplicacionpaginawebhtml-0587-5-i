<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Formularios en HTML</title>    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <h2>Formularios con agrupamiento</h2>
    <form action="" method="post">
        <!-- <fieldset>:marco contenedor -->
        <fieldset>
            <!-- <legend>: define el título principal -->
            <legend>Datos personales</legend>
            Nombre y apellido:
            <input type="text" name="nombre_apellido"><br>
            Documento valido:
            <!-- <input type="file">:botón para adjuntar un archivo -->
            <input type="file" name="documento"><br>
            Fecha de nacimiento:
            <!-- <input type="date">: calendario -->
            <input type="date" name="fecha_nacimiento">
        </fieldset>
        <fieldset>
            <legend>Datos de estudio:</legend>
            Nombre de la escuela:
            <input type="text" name="escuela"><br>
            Certificado valido:
            <input type="file" name="certificado"><br>
            Fecha de egreso:
            <input type="date" name="fecha_egreso">
        </fieldset><br>
        <!-- <button type="submit">:envia -->
        <button type="submit">Enviar 
            <i class="fa-regular fa-paper-plane"></i> 
        </button>
        <!-- <button type="reset">:reinicia-->
        <button type="reset">Borrar 
            <i class="fa fa-trash"></i>
        </button>
    </form>
</body>
</html>
