<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Formularios en HTML</title>    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con campos ocultos</h2>
    <form action="" method="post">
        <!-- <input type="hidden">: envia dato al servidor, es invisible-->
        <input type="hidden" name="hora" value="3:30">
        Ingresa tu nombre:
        <!-- <input type="text">: la entrada de texto plano -->
        <input type="text" name="nombre"><br>
        <!-- <button type="submit">:botón enviar-->
        <button type="submit">Enviar 
            <!-- <i>:icono papel -->
            <i class="fa-regular fa-paper-plane"></i> 
        </button>
        <!-- <button type="reset">: boton reinicio-->
        <button type="reset">Borrar 
            <!-- <i>:icono de basura -->
            <i class="fa fa-trash"></i>
        </button>
    </form>
</body>
</html>
