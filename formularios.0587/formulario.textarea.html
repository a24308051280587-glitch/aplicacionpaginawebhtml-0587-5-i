<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Formularios en HTML</title>    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <h2>Formulario con text area</h2>
    <form action="" method="post">
        Ingresa tu nombre:
        <input type="text" name="nombre"><br>
        Ingresa tu correo:
        <!-- <input type="email">:para correos electronicos almacena-->
        <input type="email" name="correo"><br>
        Ingresa tus comentarios:
        <!-- <textarea>:ideal para parrafos extensos-->
        <textarea name="comentarios" rows="1" cols="10"></textarea><br>
        <!-- <input type="submit">: boton enviar -->
        <input type="submit" value="enviar">
        <!-- <input type="reset">: boton reinicio-->
        <input type="reset" value="borrar">
    </form>
</body>
</html>
